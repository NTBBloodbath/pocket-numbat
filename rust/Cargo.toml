[package]
name = "numbat-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[lib]
name = "numbat_bridge"
crate-type = ["cdylib", "rlib"]

[dependencies]
codespan-reporting = "0.12"
jni = { version = "0.21", default-features = false }
numbat = { version = "1.24", default-features = false }

[profile.release]
lto = "thin"
strip = "symbols"
codegen-units = 1
